# 代理访问日志仅留状态、耗时和本机编号；默认$request会带订单查询参数或权限URL。
log_format lr_safe '$time_iso8601 status=$status duration=$request_time proxy_request_id=$request_id';
server {
    access_log /dev/stdout lr_safe;
    # Nginx原始错误行可能附完整请求地址；应用错误由脱敏日志及排查编号定位。
    error_log /dev/null;
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 5m;
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location / { try_files $uri $uri/ /index.html; }
}
